name: PR checks

on:
  pull_request:
    branches:
      - "main"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      firmware: ${{ steps.changes.outputs.firmware }}
      middleware: ${{ steps.changes.outputs.middleware }}
      web: ${{ steps.changes.outputs.web }}
      cloud_api: ${{ steps.changes.outputs.cloud_api }}
      bridge: ${{ steps.changes.outputs.bridge }}
    # https://github.com/dorny/paths-filter
    steps:
      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            firmware:
            - 'firmware/**'
            middleware:
            - 'middleware/**'
            web:
            - 'web/**'
            cloud_api:
            - 'cloud_api/**'
            - 'shared/**'
            bridge:
            - 'bridge/**'
            - 'shared/**'
            # The bridge reuses these two from middleware/ unchanged.
            - 'middleware/obs.py'
            - 'middleware/templates/**'

  build-firmware:
    name: "👻 build firmware"
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    defaults:
      run:
        working-directory: "./firmware"
    steps:
      - uses: actions/checkout@v4
      # https://docs.platformio.org/en/stable/integration/ci/github-actions.html
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - run: pio run

  build-middleware:
    name: "🧙 build middleware"
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.middleware == 'true' }}
    defaults:
      run:
        working-directory: "./middleware"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: pytest tests -q

  build-cloud-api:
    name: "☁️ build cloud_api"
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.cloud_api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: |
          python -m pip install --upgrade pip
          pip install -r cloud_api/requirements.txt
          pip install pytest
      - run: pytest cloud_api/tests -q

  build-bridge:
    name: "🌉 build bridge"
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.bridge == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: |
          python -m pip install --upgrade pip
          pip install -r bridge/requirements.txt
          pip install pytest
      - run: pytest bridge/tests -q

  build-web:
    name: "🕸️ build web"
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.web == 'true' }}
    defaults:
      run:
        working-directory: "./web"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install
      - run: corepack yarn build
      - run: corepack yarn test
